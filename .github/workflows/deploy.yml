name: Deploy (terraform apply + schemachange deploy)

# Two tools, run in this order — same sequence as DEPLOYMENT.md.
# terraform-apply is gated behind the `production` GitHub Environment,
# which requires a manual approval click before it runs (configure the
# required reviewer under Settings > Environments > production). Nothing
# in schemachange-deploy has its own gate — it can't start until
# terraform-apply finishes, so the one approval covers the whole sequence.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "migrations/**"
      - "schemachange-config.yml"
      - ".github/workflows/deploy.yml"

jobs:
  terraform-apply:
    name: terraform apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      TF_VAR_SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      TF_VAR_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      TF_VAR_SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/tf_deployer_key.p8
      TF_VAR_RUNTIME_USERS: ${{ secrets.RUNTIME_USERS }}
      TF_VAR_GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      TF_VAR_GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      TF_VAR_GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      TF_VAR_AZURE_DI_ENDPOINT_HOST: ${{ secrets.AZURE_DI_ENDPOINT_HOST }}
      TF_VAR_AZURE_DI_API_KEY: ${{ secrets.AZURE_DI_API_KEY }}
      TF_VAR_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Write deployer private key
        run: |
          cat > /tmp/tf_deployer_key.p8 << 'KEYEOF'
          ${{ secrets.SNOWFLAKE_TF_PRIVATE_KEY_PEM }}
          KEYEOF
          chmod 600 /tmp/tf_deployer_key.p8

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform apply -auto-approve

  schemachange-deploy:
    name: schemachange deploy
    runs-on: ubuntu-latest
    needs: terraform-apply
    env:
      SNOWFLAKE_DEFAULT_CONNECTION_NAME: newacct
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install schemachange snowflake-cli

      - name: Write deployer private key
        run: |
          cat > /tmp/tf_deployer_key.p8 << 'KEYEOF'
          ${{ secrets.SNOWFLAKE_TF_PRIVATE_KEY_PEM }}
          KEYEOF
          chmod 600 /tmp/tf_deployer_key.p8

      - name: Register snow CLI connection
        run: |
          snow connection add \
            --connection-name newacct \
            --account "${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}-${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-file /tmp/tf_deployer_key.p8 \
            --role ACCOUNTADMIN \
            --warehouse O2C_WH \
            --database O2C_DB \
            --no-interactive

      - run: schemachange deploy --config-folder .
