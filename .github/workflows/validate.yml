name: Validate (plan + dry-run)

# Runs on every PR touching terraform/ or migrations/ — terraform plan and
# schemachange --dry-run both need live Snowflake connectivity to compare
# against current account state, so this still needs the same secrets as
# the real deploy workflow. Nothing here mutates the account: plan and
# dry-run only read state.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "migrations/**"
      - "schemachange-config.yml"
      - ".github/workflows/**"

jobs:
  terraform-plan:
    name: terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      TF_VAR_SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      TF_VAR_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      TF_VAR_SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/tf_deployer_key.p8
      TF_VAR_RUNTIME_USERS: ${{ secrets.RUNTIME_USERS }}
      TF_VAR_GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      TF_VAR_GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      TF_VAR_GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      TF_VAR_AZURE_DI_ENDPOINT_HOST: ${{ secrets.AZURE_DI_ENDPOINT_HOST }}
      TF_VAR_AZURE_DI_API_KEY: ${{ secrets.AZURE_DI_API_KEY }}
      TF_VAR_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Write deployer private key
        run: |
          cat > /tmp/tf_deployer_key.p8 << 'KEYEOF'
          ${{ secrets.SNOWFLAKE_TF_PRIVATE_KEY_PEM }}
          KEYEOF
          chmod 600 /tmp/tf_deployer_key.p8

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -no-color

  schemachange-dry-run:
    name: schemachange dry-run
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_DEFAULT_CONNECTION_NAME: newacct
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install schemachange snowflake-cli

      - name: Write deployer private key
        run: |
          cat > /tmp/tf_deployer_key.p8 << 'KEYEOF'
          ${{ secrets.SNOWFLAKE_TF_PRIVATE_KEY_PEM }}
          KEYEOF
          chmod 600 /tmp/tf_deployer_key.p8

      - name: Write connections.toml
        # Writing this by hand instead of via `snow connection add` — the
        # CLI's default write location differs by OS/state (XDG path on a
        # fresh Linux runner with no pre-existing ~/.snowflake dir vs.
        # SNOWFLAKE_HOME being interpreted differently by schemachange
        # itself), so relying on its auto-detection kept landing schemachange
        # and snow CLI on two different files. schemachange's own default
        # lookup (~/.snowflake/connections.toml) is the one fixed target here.
        run: |
          mkdir -p "$HOME/.snowflake"
          cat > "$HOME/.snowflake/connections.toml" << EOF
          [newacct]
          account = "${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}-${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          role = "ACCOUNTADMIN"
          warehouse = "O2C_WH"
          database = "O2C_DB"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "/tmp/tf_deployer_key.p8"
          EOF
          chmod 600 "$HOME/.snowflake/connections.toml"

      - run: schemachange deploy --config-folder . --dry-run
