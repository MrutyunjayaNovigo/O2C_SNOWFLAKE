# schemachange config — see migrations/README.md for the full how-it-works doc.
#
# config-version: 2 schema (schemachange >= 4.0) — this repo is pinned to
# schemachange 4.3.3. The old config-version: 1 flat schema (a nested
# change-history-table block, top-level snowflake-* keys) doesn't work on
# this version — as of 4.0 everything lives under a `schemachange:` key,
# and change-history-table is one dotted string, not a dict. If
# `schemachange --version` ever reports something outside the 4.x line,
# diff this file against `schemachange --help` before trusting it as-is.

config-version: 2

schemachange:
  root-folder: 'migrations'

  # Reuses a Snowflake CLI connection (the same `snow` CLI + named
  # connection 10_copilot/deploy.sh already uses) instead of duplicating
  # account/user/auth here. Create the connection once per account with:
  #   snow connection add --connection-name newacct ...
  # then point either env var at it:
  #   export SNOWFLAKE_DEFAULT_CONNECTION_NAME=newacct
  # Reads warehouse/database/role from the connection itself
  # (~/.snowflake/connections.toml) — add those there, not here, so this
  # file doesn't need a second place to drift out of sync.
  connection-name: '{{ env_var("SNOWFLAKE_DEFAULT_CONNECTION_NAME", "newacct") }}'

  # schemachange creates and owns this table itself on first run (needs
  # CREATE SCHEMA/TABLE on O2C_DB — ACCOUNTADMIN has it, O2C_APP
  # deliberately does not, same "runtime role can't create" boundary the
  # rest of the repo already uses). create-change-history-table must be
  # explicit in config-version: 2 — it wasn't optional in the old v1
  # schema, but 4.x defaults it to false.
  change-history-table: 'O2C_DB.SCHEMACHANGE.CHANGE_HISTORY'
  create-change-history-table: true

  # No secrets or environment-specific literals live in migrations/ —
  # those moved to Terraform (terraform/07_network_and_secrets.tf)
  # precisely so nothing sensitive has to pass through Jinja templating
  # here. Left empty deliberately; add entries only if a future migration
  # needs a non-secret, per-environment value (e.g. templating the
  # database name for a second environment in the same account).
  vars: {}
